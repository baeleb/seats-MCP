<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="seats-MCP: award flights and hotel stays for your coding agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#111b36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- background card -->
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="24" fill="none" stroke="#1e2a4a" stroke-width="1"/>

  <!-- faint terminal grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M64 0V320M192 0V320M320 0V320M448 0V320M576 0V320M704 0V320M832 0V320M960 0V320M1088 0V320M1216 0V320"/>
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
  </g>

  <!-- wordmark: prompt chevron drawn to sit on the cap-height center -->
  <path d="M70 88 L86 101 L70 114" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="700" fill="#f8fafc" letter-spacing="-2"><tspan fill="#2dd4bf">seats</tspan><tspan fill="#f8fafc">-MCP</tspan></text>

  <!-- tagline -->
  <text x="104" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#8ea0bf">Your coding agent now has frequent flyer status.</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <rect x="64" y="216" width="196" height="44" rx="22" fill="#0e1830" stroke="#243354"/>
    <text x="82" y="245" font-size="22" fill="#2dd4bf">&#10095;&#10095;</text>
    <text x="114" y="244" fill="#c7d5ec">seats.aero</text>

    <rect x="276" y="216" width="196" height="44" rx="22" fill="#0e1830" stroke="#243354"/>
    <!-- two-building icon sharing a baseline -->
    <g fill="#fbbf24">
      <rect x="292" y="230" width="13" height="16" rx="1.5"/>
      <rect x="308" y="222" width="9" height="24" rx="1.5"/>
    </g>
    <text x="326" y="244" fill="#c7d5ec">rooms.aero</text>

    <rect x="488" y="216" width="90" height="44" rx="22" fill="#0e1830" stroke="#243354"/>
    <text x="512" y="244" fill="#c7d5ec">MCP</text>
  </g>

  <!-- award route: LAX to NRT, arc peaking near the middle -->
  <path d="M780 250 Q 990 90 1160 168" fill="none" stroke="url(#route)" stroke-width="3.5" stroke-dasharray="1 12" stroke-linecap="round"/>
  <text x="980" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8ea0bf">LAX &#8594; NRT</text>

  <!-- plane (paper-plane silhouette) centered on the route end, rotated to the heading (~25&#176;) -->
  <g transform="translate(1160 168) rotate(25) translate(-18 -18) scale(1.5)">
    <path d="M2 21 L23 12 L2 3 L2 10 L17 12 L2 14 Z" fill="#2dd4bf"/>
  </g>

  <!-- points chip, clear of the route -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <rect x="886" y="204" width="150" height="38" rx="19" fill="#0e1830" stroke="#3a3320"/>
    <text x="961" y="229" text-anchor="middle" fill="#fbbf24">30,000 pts</text>
  </g>

  <!-- hotel skyline -->
  <g>
    <rect x="1024" y="224" width="34" height="52" rx="3" fill="#16223f"/>
    <rect x="1064" y="202" width="40" height="74" rx="3" fill="#1a2748"/>
    <rect x="1112" y="236" width="28" height="40" rx="3" fill="#16223f"/>
    <rect x="1146" y="214" width="44" height="62" rx="3" fill="#1a2748"/>
    <g fill="#fbbf24">
      <rect x="1072" y="212" width="6" height="6" rx="1"/><rect x="1086" y="212" width="6" height="6" rx="1"/>
      <rect x="1072" y="228" width="6" height="6" rx="1"/><rect x="1100" y="228" width="6" height="6" rx="1"/>
      <rect x="1154" y="224" width="6" height="6" rx="1"/><rect x="1168" y="224" width="6" height="6" rx="1"/>
      <rect x="1154" y="240" width="6" height="6" rx="1"/><rect x="1182" y="240" width="6" height="6" rx="1"/>
    </g>
    <g fill="#38bdf8">
      <rect x="1032" y="234" width="6" height="6" rx="1"/><rect x="1046" y="250" width="6" height="6" rx="1"/>
      <rect x="1120" y="246" width="6" height="6" rx="1"/>
    </g>
  </g>
</svg>
